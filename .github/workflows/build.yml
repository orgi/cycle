name: Build

on:
  push:
    # iphone-pilot: every push builds the sideloadable .ipa (docs/ios-sideload.md)
    # with no manual "Run workflow" click.
    branches: [main, iphone-pilot]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # No android/key.properties + cycle-release.jks in CI (both gitignored,
      # see CLAUDE.md "Release signing"), so this falls back to debug signing.
      # Split into the 32-bit (armeabi-v7a) and 64-bit (arm64-v8a) APKs only —
      # skip x86_64, which the target devices don't use.
      - name: Build release APKs (armeabi-v7a + arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a-32bit
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a-64bit
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing identity is configured here (free Apple ID, no paid
      # developer account), so this builds UNSIGNED and packages it as an .ipa
      # (Payload/Runner.app, zipped). A sideloader on the user's machine
      # (Impactor — see docs/ios-sideload.md) signs it with their free Apple ID
      # and installs it over USB.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "cycle-${version}-unsigned.ipa" Payload)
          ls -la build/ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: build/ipa/*.ipa
